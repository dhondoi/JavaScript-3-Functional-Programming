<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functional Programming</title>
  </head>
  <body>
    <script>
      /*
      KONSEP FP
      */
      /*
      1. Pure Function
      tidak bergantung terhadap nilai yang berada di luar fungsi atau parameternya.
      Selain dilarang untuk bergantung terhadap nilai luar, pure function juga dilarang keras untuk mengubah nilai yang berada di luar baik secara sengaja atau tidak sengaja. Pure function tidak boleh menimbulkan efek samping (no side effect) ketika digunakan.
      */
      // contoh 1
      const hitungLuasLingkaran = (jariJari) => {
        return 3.14 * (jariJari * jariJari);
      };
      // contoh 2
      const createPersonWithAge = (age, person) => {
        // person.age = age;
        // return person;
        return { ...person, age }; // pure function trigger
      };
      const person = {
        name: "Bobo",
      };
      const newPerson = createPersonWithAge(18, person);
      console.log({
        person,
        newPerson,
      });
      /*
      2. Immutability
      Immutable berarti sebuah objek tidak boleh diubah setelah objek tersebut dibuat.
      */
      // contoh
      const user = {
        firstname: "Harry",
        lastName: "Protter", // ups, typo!
      };
      const createUserWithNewLastName = (newLastName, user) => {
        return { ...user, lastName: newLastName };
      };
      const newUser = createUserWithNewLastName("Potter", user);
      console.log(newUser);
      /*
      3. Rekursif
      teknik pada sebuah function yang memanggil dirinya sendiri.
      */
      // contoh
      const countDown = (start) => {
        console.log(start);
        if (start > 0) countDown(start - 1);
      };
      countDown(10);
      /*
      4. Higher-Order Function
      karena itu fungsi pada JavaScript dapat diperlakukan layaknya sebuah data. Kita bisa menyimpan function dalam variabel, memberikan function sebagai parameter pada fungsi lainnya, hingga mengembalikan function di dalam function.
      */
      // contoh
      const names = ["Harry", "Ron", "Jeff", "Thomas"];
      const arrayMap = (arr, action) => {
        const loopTrough = (arr, action, newArray = [], index = 0) => {
          const item = arr[index];
          if (!item) return newArray;
          return loopTrough(arr, action, [...newArray, action(arr[index])], index + 1);
        };
        return loopTrough(arr, action);
      };
      const newNames = arrayMap(names, (name) => `${name}!`);
      console.log({
        names,
        newNames,
      });
    </script>
  </body>
</html>
